---
apiVersion: v1
kind: Namespace
metadata:
  name: langflow
---
apiVersion: v1
kind: Secret
metadata:
  name: regcred${DOMAIN}
  namespace: langflow
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ${DOCKER_CONFIG_JSON}
---
apiVersion: v1
kind: Secret
metadata:
  name: langflow-auth${DOMAIN}
  namespace: langflow
type: Opaque
stringData:
  # Supply LANGFLOW_SUPERUSER_PASSWORD through the deployment environment or
  # secret manager before templating this manifest. Never commit the password.
  password: "${LANGFLOW_SUPERUSER_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: langflow-postgres${DOMAIN}
  namespace: langflow
type: Opaque
stringData:
  # Supply POSTGRES_PASSWORD through the deployment environment or a secret
  # manager before templating this manifest. Never commit the password.
  POSTGRES_USER: langflow
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_DB: langflow
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langflow-postgres
  namespace: langflow
spec:
  serviceName: langflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app: langflow-postgres
  template:
    metadata:
      labels:
        app: langflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-trixie
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: langflow-postgres${DOMAIN}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langflow-postgres${DOMAIN}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: langflow-postgres${DOMAIN}
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: langflow-postgres
  namespace: langflow
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app: langflow-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langflow-qdrant
  namespace: langflow
spec:
  serviceName: langflow-qdrant
  replicas: 1
  selector:
    matchLabels:
      app: langflow-qdrant
  template:
    metadata:
      labels:
        app: langflow-qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langflow-qdrant
  namespace: langflow
spec:
  ports:
    - name: http
      port: 6333
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 6334
      targetPort: grpc
      protocol: TCP
  selector:
    app: langflow-qdrant
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow
  namespace: langflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langflow
  template:
    metadata:
      labels:
        app: langflow
    spec:
      enableServiceLinks: false
      containers:
        - name: langflow
          image: harbor.727th.com/docker-registry/langflow:${IMAGE_TAG}
          ports:
            - containerPort: 8989
          env:
            - name: ENVIRONMENT_TYPE
              value: PROD
            - name: VERSION
              value: ${IMAGE_TAG}
            - name: LANGFLOW_HOST
              value: 0.0.0.0
            - name: LANGFLOW_PORT
              value: "8989"
            # Enable Langflow's Workflow API so long-running runs can be
            # submitted in background mode or consumed as an SSE stream.
            - name: LANGFLOW_DEVELOPER_API_ENABLED
              value: "true"
            - name: LANGFLOW_WORKFLOW_EXECUTION_TIMEOUT
              value: "1800"
            - name: LANGFLOW_BACKGROUND_JOB_TIMEOUT
              value: "1800"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: langflow-postgres${DOMAIN}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langflow-postgres${DOMAIN}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: langflow-postgres${DOMAIN}
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              value: langflow-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: LANGFLOW_DATABASE_CONNECTION_RETRY
              value: "true"
            - name: QDRANT_HOST
              value: langflow-qdrant
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_GRPC_PORT
              value: "6334"
            - name: LANGFLOW_SSRF_ALLOWED_HOSTS
              value: langflow-qdrant
            - name: LANGFLOW_SUPERUSER
              value: "${LANGFLOW_USER}"
            - name: LANGFLOW_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langflow-auth${DOMAIN}
                  key: password
            - name: LANGFLOW_CORS_ORIGINS
              value: "https://langflow.${DOMAIN}.com"
            - name: LANGFLOW_CORS_ALLOW_CREDENTIALS
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DOMAIN
              value: ${DOMAIN}
      imagePullSecrets:
        - name: regcred${DOMAIN}
---
apiVersion: v1
kind: Service
metadata:
  name: langflow
  namespace: langflow
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8989
      protocol: TCP
  selector:
    app: langflow
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-middleware
  namespace: langflow
spec:
  forwardAuth:
    address: https://auth.${DOMAIN}.com/?rd=https%3A%2F%2Flangflow.${DOMAIN}.com
    trustForwardHeader: true
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: langflow-ingress
  namespace: langflow
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # API requests authenticate with Langflow's x-api-key header, so they must
    # reach Langflow instead of being redirected through the browser OAuth flow.
    - match: Host(`langflow.${DOMAIN}.com`) && PathPrefix(`/api/`)
      kind: Rule
      priority: 100
      services:
        - name: langflow
          port: 80
    - match: Host(`langflow.${DOMAIN}.com`) && (Path(`/health`) || Path(`/health_check`))
      kind: Rule
      priority: 90
      services:
        - name: langflow
          port: 80
    - match: Host(`langflow.${DOMAIN}.com`)
      kind: Rule
      priority: 1
      services:
        - name: langflow
          port: 80
      middlewares:
        - name: oauth2-proxy-middleware
  tls:
    secretName: ${DOMAIN}-com-tls

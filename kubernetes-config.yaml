---
apiVersion: v1
kind: Namespace
metadata:
  name: langflow
---
apiVersion: v1
kind: Secret
metadata:
  name: regcred${DOMAIN}
  namespace: langflow
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ${DOCKER_CONFIG_JSON}
---
apiVersion: v1
kind: Secret
metadata:
  name: langflow-auth${DOMAIN}
  namespace: langflow
type: Opaque
stringData:
  # Supply LANGFLOW_SUPERUSER_PASSWORD through the deployment environment or
  # secret manager before templating this manifest. Never commit the password.
  password: "${LANGFLOW_SUPERUSER_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: langflow-postgres${DOMAIN}
  namespace: langflow
type: Opaque
stringData:
  # Supply POSTGRES_PASSWORD through the deployment environment or a secret
  # manager before templating this manifest. Never commit the password.
  POSTGRES_USER: langflow
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_DB: langflow
---
apiVersion: v1
kind: Secret
metadata:
  name: langflow-falkordb${DOMAIN}
  namespace: langflow
type: Opaque
stringData:
  # FalkorDB is internal-only. The flow reads this URL from the pod environment;
  # it is not exposed through a LoadBalancer or an IngressRoute.
  FALKORDB_USERNAME: default
  FALKORDB_PASSWORD: "FalkorDB-Graph-727th-2026!"
  FALKORDB_DATABASE: "0"
  FALKORDB_URL: "redis://default:FalkorDB-Graph-727th-2026%21@langflow-falkordb.langflow.svc.cluster.local:6379/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: langflow-status-reporter${DOMAIN}
  namespace: langflow
type: Opaque
stringData:
  # Provide these through the deployment environment/secret manager. The
  # reporter sends only the periodic checkpoint summary; it never runs or
  # mutates the analysis workflow.
  EMAIL_API_KEY: "${EMAIL_API_KEY}"
  EMAIL_RECIPIENT: "${EMAIL_RECIPIENT}"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langflow-postgres
  namespace: langflow
spec:
  serviceName: langflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app: langflow-postgres
  template:
    metadata:
      labels:
        app: langflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-trixie
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: langflow-postgres${DOMAIN}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langflow-postgres${DOMAIN}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: langflow-postgres${DOMAIN}
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Sized so observed peak stays at or below 80% of the limit.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # 256Mi filled up and Postgres rejected every write with DiskFull,
            # which silently killed workflow runs mid-execution. Run history costs
            # roughly 160Mi per regime run and an estimated 400Mi per stock run, so
            # a month of daily runs peaks near 17Gi — 71% of this claim.
            # NOTE: volumeClaimTemplates are immutable. To change this on the live
            # cluster: kubectl delete statefulset langflow-postgres --cascade=orphan,
            # then apply, then expand the PVC itself.
            storage: 24Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langflow-postgres
  namespace: langflow
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app: langflow-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langflow-qdrant
  namespace: langflow
spec:
  serviceName: langflow-qdrant
  replicas: 1
  selector:
    matchLabels:
      app: langflow-qdrant
  template:
    metadata:
      labels:
        app: langflow-qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          # Sized so observed peak stays at or below 80% of the limit.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # Currently 0.13Gi in use; headroom for embedding growth well under 80%.
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langflow-qdrant
  namespace: langflow
spec:
  ports:
    - name: http
      port: 6333
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 6334
      targetPort: grpc
      protocol: TCP
  selector:
    app: langflow-qdrant
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langflow-falkordb
  namespace: langflow
spec:
  serviceName: langflow-falkordb
  replicas: 1
  selector:
    matchLabels:
      app: langflow-falkordb
  template:
    metadata:
      labels:
        app: langflow-falkordb
    spec:
      enableServiceLinks: false
      containers:
        - name: falkordb
          image: falkordb/falkordb-server:v4.20.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_ARGS
              value: >-
                --requirepass FalkorDB-Graph-727th-2026!
                --appendonly yes
                --appendfsync everysec
                --dir /var/lib/falkordb/data
                --maxmemory 900mb
                --maxmemory-policy noeviction
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: langflow-falkordb${DOMAIN}
                  key: FALKORDB_PASSWORD
          volumeMounts:
            - name: falkordb-data
              mountPath: /var/lib/falkordb/data
          startupProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # FalkorDB holds the graph in memory; 0.44Gi on disk today, so the limit
          # keeps peak resident size at or below 80% with room for growth.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 1280Mi
  volumeClaimTemplates:
    - metadata:
        name: falkordb-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langflow-falkordb
  namespace: langflow
spec:
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app: langflow-falkordb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow
  namespace: langflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langflow
  template:
    metadata:
      labels:
        app: langflow
    spec:
      enableServiceLinks: false
      containers:
        - name: langflow
          image: harbor.727th.com/docker-registry/langflow:${IMAGE_TAG}
          ports:
            - containerPort: 8989
          env:
            - name: ENVIRONMENT_TYPE
              value: PROD
            - name: VERSION
              value: ${IMAGE_TAG}
            - name: LANGFLOW_HOST
              value: 0.0.0.0
            - name: LANGFLOW_PORT
              value: "8989"
            # Enable Langflow's Workflow API. Long analyses must be submitted
            # with mode=background; the POST returns immediately and the run
            # continues independently of the caller's HTTP connection.
            - name: LANGFLOW_DEVELOPER_API_ENABLED
              value: "true"
            # 0 means no wall-clock ceiling. The workflow engine maps this
            # deployment value to None, including for background runs.
            - name: LANGFLOW_WORKFLOW_EXECUTION_TIMEOUT
              value: "0"
            # A single async worker avoids cross-worker in-memory executor
            # loss. Gunicorn's 0 disables its worker timeout; Kubernetes still
            # manages the pod lifecycle independently.
            - name: LANGFLOW_WORKERS
              value: "1"
            - name: LANGFLOW_WORKER_TIMEOUT
              value: "0"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: langflow-postgres${DOMAIN}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langflow-postgres${DOMAIN}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: langflow-postgres${DOMAIN}
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              value: langflow-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: LANGFLOW_DATABASE_CONNECTION_RETRY
              value: "true"
            - name: QDRANT_HOST
              value: langflow-qdrant
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_GRPC_PORT
              value: "6334"
            - name: LANGFLOW_SSRF_ALLOWED_HOSTS
              value: langflow-qdrant,langflow-falkordb
            - name: FALKORDB_HOST
              value: langflow-falkordb
            - name: FALKORDB_PORT
              value: "6379"
            - name: FALKORDB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: langflow-falkordb${DOMAIN}
                  key: FALKORDB_USERNAME
            - name: FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langflow-falkordb${DOMAIN}
                  key: FALKORDB_PASSWORD
            - name: FALKORDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: langflow-falkordb${DOMAIN}
                  key: FALKORDB_DATABASE
            - name: FALKORDB_URL
              valueFrom:
                secretKeyRef:
                  name: langflow-falkordb${DOMAIN}
                  key: FALKORDB_URL
            - name: LANGFLOW_FALKORDB_URL
              valueFrom:
                secretKeyRef:
                  name: langflow-falkordb${DOMAIN}
                  key: FALKORDB_URL
            - name: LANGFLOW_FALKORDB_GRAPH_NAME
              value: undervalued_stocks_knowledge
            - name: EMAIL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: langflow-status-reporter${DOMAIN}
                  key: EMAIL_API_KEY
            - name: EMAIL_RECIPIENT
              valueFrom:
                secretKeyRef:
                  name: langflow-status-reporter${DOMAIN}
                  key: EMAIL_RECIPIENT
            - name: LANGFLOW_SUPERUSER
              value: "${LANGFLOW_USER}"
            - name: LANGFLOW_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langflow-auth${DOMAIN}
                  key: password
            - name: LANGFLOW_CORS_ORIGINS
              value: "https://langflow.${DOMAIN}.com"
            - name: LANGFLOW_CORS_ALLOW_CREDENTIALS
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DOMAIN
              value: ${DOMAIN}
          # The container ran unbounded, so a heavy graph could consume the whole
          # node. Large flows (48-126 vertices carrying ~1Mi payloads) peak near
          # 4Gi, which is 80% of this limit.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      imagePullSecrets:
        - name: regcred${DOMAIN}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: langflow-status-reporter
  namespace: langflow
spec:
  # UTC controller time; one report in each 12-hour slot.
  schedule: "0 */12 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: langflow-status-reporter
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reporter
              image: harbor.727th.com/docker-registry/langflow:${IMAGE_TAG}
              imagePullPolicy: IfNotPresent
              # Standard-library reader over the FalkorDB ledger; it summarises at
              # most 20 rows, so peak stays far below 80% of this limit.
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              command:
                - python3.14
                - /usr/local/bin/langflow-run-status-reporter
              env:
                - name: FALKORDB_HOST
                  value: langflow-falkordb
                - name: FALKORDB_PORT
                  value: "6379"
                - name: FALKORDB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: langflow-falkordb${DOMAIN}
                      key: FALKORDB_USERNAME
                - name: FALKORDB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: langflow-falkordb${DOMAIN}
                      key: FALKORDB_PASSWORD
                - name: FALKORDB_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: langflow-falkordb${DOMAIN}
                      key: FALKORDB_DATABASE
                - name: FALKORDB_GRAPH_NAME
                  value: undervalued_stocks_knowledge
                - name: EMAIL_API_URL
                  value: https://email-api.727th.com/api/email/send
                - name: EMAIL_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: langflow-status-reporter${DOMAIN}
                      key: EMAIL_API_KEY
                - name: EMAIL_RECIPIENT
                  valueFrom:
                    secretKeyRef:
                      name: langflow-status-reporter${DOMAIN}
                      key: EMAIL_RECIPIENT
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          imagePullSecrets:
            - name: regcred${DOMAIN}
---
apiVersion: v1
kind: Service
metadata:
  name: langflow
  namespace: langflow
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8989
      protocol: TCP
  selector:
    app: langflow
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-middleware
  namespace: langflow
spec:
  forwardAuth:
    address: https://auth.${DOMAIN}.com/?rd=https%3A%2F%2Flangflow.${DOMAIN}.com
    trustForwardHeader: true
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: langflow-ingress
  namespace: langflow
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # API requests authenticate with Langflow's x-api-key header, so they must
    # reach Langflow instead of being redirected through the browser OAuth flow.
    - match: Host(`langflow.${DOMAIN}.com`) && PathPrefix(`/api/`)
      kind: Rule
      priority: 100
      services:
        - name: langflow
          port: 80
    - match: Host(`langflow.${DOMAIN}.com`) && (Path(`/health`) || Path(`/health_check`))
      kind: Rule
      priority: 90
      services:
        - name: langflow
          port: 80
    - match: Host(`langflow.${DOMAIN}.com`)
      kind: Rule
      priority: 1
      services:
        - name: langflow
          port: 80
      middlewares:
        - name: oauth2-proxy-middleware
  tls:
    secretName: ${DOMAIN}-com-tls
